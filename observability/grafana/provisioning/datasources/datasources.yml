# Grafana datasource provisioning.
#
# When Grafana boots inside docker-compose, it picks up this file and creates
# three datasources automatically. The URLs use the docker-compose service
# names because everything shares the default compose network.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags:
          - component
          - repo
