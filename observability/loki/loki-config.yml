# Minimal single-binary Loki config for the lab's docker-compose stack.
#
# Not for production. Filesystem chunks, in-memory ring via memberlist, no
# authentication. Just enough to slurp `artifacts/logs/*.jsonl` via Promtail
# and query them from Grafana's Explore tab.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

memberlist:
  join_members: []

limits_config:
  retention_period: 168h
  allow_structured_metadata: true

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
