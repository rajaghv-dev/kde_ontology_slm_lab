# Training-loop alert rules.
groups:
  - name: kde_training
    rules:
      - alert: KdeTrainingLossStuck
        expr: rate(kde_training_loss[10m]) == 0
        for: 30m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training loss has not changed for 30 minutes"
          description: >
            kde_training_loss has shown zero rate of change over a ten-minute
            window for half an hour. Verify learning rate, dataloader, and
            adapter wiring; the optimizer may be frozen.
