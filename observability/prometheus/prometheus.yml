# Prometheus scrape configuration for the lab.
#
# The lab's metrics exporter (observability/exporters/kde_metrics_exporter.py)
# listens on :9101 on the host. From inside the prometheus container we reach
# it via the special "host.docker.internal" alias.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kde_ontology_slm_lab
    env: dev

rule_files:
  - /etc/prometheus/rules/*.yml

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:
  - job_name: kde_metrics_exporter
    static_configs:
      - targets:
          - host.docker.internal:9101
        labels:
          component: kde_lab
